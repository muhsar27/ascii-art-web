<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Art Result</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><path d='M24 32 L46 50 L24 68' fill='none' stroke='%2338bdf8' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/><line x1='54' y1='68' x2='76' y2='68' stroke='%236366f1' stroke-width='10' stroke-linecap='round'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-card: #1e293b;
            --bg-terminal: #070b14;
            --border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-green: #34d399;
            --radius-lg: 14px;
            --radius-md: 8px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 9px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #475569;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px -2px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -2px rgba(99, 102, 241, 0.5);
        }

        .terminal-window {
            background: var(--bg-terminal);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .terminal-header {
            background: #111827;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red { background: #ef4444; }
        .dot-yellow { background: #eab308; }
        .dot-green { background: #22c55e; }

        .terminal-title {
            margin-left: 8px;
            font-size: 12px;
            font-family: 'Fira Code', monospace;
            color: #64748b;
        }

        pre {
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.25;
            color: var(--accent);
            padding: 24px;
            overflow-x: auto;
            white-space: pre;
            background: transparent;
            user-select: text;
        }

        /* Custom scrollbar */
        pre::-webkit-scrollbar {
            height: 8px;
        }
        pre::-webkit-scrollbar-track {
            background: #0b1120;
        }
        pre::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        pre::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 16px;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .actions {
                justify-content: stretch;
            }
            .btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <div class="header-title-group">
                <h1>ASCII ART</h1>
            </div>
            <div class="actions">
                <a href="/" class="btn btn-secondary">← Back</a>
                <button type="button" class="btn btn-primary" id="copy-btn" onclick="copyArt()">Copy Art</button>
            </div>
        </div>

        <div class="terminal-window">
            <div class="terminal-header">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
                <span class="terminal-title">ascii_output.txt</span>
            </div>
            <pre id="art-output">{{.}}</pre>
        </div>
    </div>

    <script>
        function copyArt() {
            const artText = document.getElementById('art-output').innerText;
            navigator.clipboard.writeText(artText).then(() => {
                const btn = document.getElementById('copy-btn');
                const orig = btn.innerText;
                btn.innerText = 'Copied! ✓';
                btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                setTimeout(() => {
                    btn.innerText = orig;
                    btn.style.background = '';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>
</html>
